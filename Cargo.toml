[package]
name = "jutella"
description = "Chatbot API client library and CLI interface."
license = "MIT"
repository = "https://github.com/dmitry-markin/jutella"
version = "0.9.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.104", optional = true }
base64 = { version = "0.23.1", optional = true }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "wrap_help"], optional = true }
colored = { version = "3.1.1", optional = true }
dirs = { version = "7.0.0", optional = true }
eventsource-stream = "0.2.3"
futures = "0.3.34"
iter_accumulate = "1.0.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "json", "hickory-dns", "http2", "rustls", "stream", "zstd" ] }
serde = { version = "1.0.229", features = ["derive"] }
serde-query = "0.2.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = { version = "1.2.1", optional = true }
url = "2.5.8"

[features]
default = ["bin"]
bin = ["dep:anyhow", "dep:base64", "dep:clap", "dep:colored", "dep:dirs", "dep:toml"]
